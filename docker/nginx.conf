server {
    listen 80;
    server_name _;

    root /var/www/html/backend/public;
    index app.html index.php;

    client_max_body_size 64M;

    # Assets compilados de Vite/React servidos directamente por Nginx
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # API Laravel y archivos de biblioteca
    location ^~ /api {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ^~ /biblioteca-files {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /up {
        try_files $uri /index.php?$query_string;
    }

    # SPA React en / y rutas frontend
    location / {
        try_files $uri $uri/ /app.html /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 120;
    }

    location ~ /\. {
        deny all;
    }
}
