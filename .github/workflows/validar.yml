name: Validar aplicación y contenido

on:
  pull_request:
  push:
    branches: [master]

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validar temario, preguntas, guías y recursos
        run: node scripts/validar.mjs
      - name: Compilar React
        run: npm --prefix frontend install --ignore-scripts && npm run build
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, sqlite3, pdo_sqlite
      - name: Instalar Laravel
        working-directory: backend
        run: composer install --no-interaction --prefer-dist
      - name: Probar API
        working-directory: backend
        run: php artisan test
