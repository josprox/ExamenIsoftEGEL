name: Validar aplicación y contenido

on:
  pull_request:
  push:
    branches: [master]

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validar temario, preguntas, guías y recursos
        run: node scripts/validar.mjs
      - uses: oven-sh/setup-bun@v2
      - name: Compilar React
        working-directory: frontend
        run: bun install --frozen-lockfile && bun run build
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Probar API en Go
        working-directory: backend
        run: go test -v ./...
